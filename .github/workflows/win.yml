name: Build and Test Snapshot (Windows)
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space-separated test class names to run (empty = full suite)"
        required: false
        default: ""
permissions:
  contents: read

jobs:
  build:
    runs-on: 'windows-2022'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java_version: ['8']
    env:
      JAVA_OPTS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"
    steps:
    - uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633 # v4.1.2
    - name: Set up JDK
      uses: actions/setup-java@99b8673ff64fbf99d8d325f52d9a5bdedb8483e9 # v4.2.1
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java_version }}
        cache: 'maven'
    - name: Build
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          FILTER="${{ inputs.test-filter }}"
          cmd //c "mvnw.cmd -B -ff -ntp clean verify -Dtest=${FILTER// /,} -Dsurefire.failIfNoSpecifiedTests=false"
        else
          cmd //c "mvnw.cmd -B -ff -ntp clean verify"
        fi
